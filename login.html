<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <section class="form-section">
    <div class="form-box">

      <div class="form-visual">
        <div class="form-visual-inner">
          <div class="form-logo">A<span>N</span>GL.</div>
          <h3>Welcome <span> back!</span></h3>
          <p>Sign in to pick up right where you left off and explore the full WS101 portfolio.</p>
        </div>
      </div>

      <div class="form-content">
        <div class="form-logo">A<span>N</span>GL.</div>
        <h2><span>Log</span> In</h2>
        <p class="subtitle">Welcome back! Please sign in to continue.</p>

        <div class="auth-error" id="authError"></div>

        <form id="loginForm">

          <div class="input-field">
            <label for="loginUser">Email Address</label>
            <div class="input-wrap">
              <i class="fas fa-envelope field-icon"></i>
              <input type="email" id="loginUser" placeholder="Enter your email" autocomplete="email">
            </div>
            <div class="form-field-error" id="loginUser-err">Please enter a valid email address.</div>
          </div>

          <div class="input-field">
            <label for="loginPass">Password</label>
            <div class="input-wrap">
              <i class="fas fa-lock field-icon"></i>
              <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="toggle-pw" data-target="loginPass" aria-label="Show password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="form-field-error" id="loginPass-err">Password is required.</div>
          </div>

          <a href="#" class="forgot-link">Forgot password?</a>

          <button type="submit" class="btn" id="loginBtn">
            <i class=""></i> Access Account
          </button>

          <p class="switch-form">New to ANGL? <a href="register.html">Create an Account</a></p>
        </form>
      </div>

    </div>
  </section>

  <script src="script.js" defer></script>
</body>
</html>
